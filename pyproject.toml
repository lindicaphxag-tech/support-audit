[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "support-audit"
version = "0.1.0"
description = "Ledoit-Wolf breakdown audit for few-shot support-set validation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Zhibo Zhang", email = "24061721@hdu.edu.cn"}]
dependencies = ["numpy>=1.24", "scikit-learn>=1.3"]
keywords = ["support-set-validation", "leave-one-out", "ledoit-wolf", "breakdown-parameter"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
support-audit = "support_audit:main"

[tool.setuptools]
py-modules = ["support_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
